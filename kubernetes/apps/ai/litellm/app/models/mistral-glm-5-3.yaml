---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: mistral-glm-5-3
spec:
  modelName: mistral/glm-5.3
  params:
    model: openai/zai-glm-5-3
    apiBase: https://api.mistral.ai/v1
    apiKeyRef:
      name: litellm-secret
      key: MISTRAL_API_KEY
    dropParams: true
  info:
    maxInputTokens: 1048576
    maxOutputTokens: 128000
    supportsFunctionCalling: true
    supportsPromptCaching: true
    extra:
      supports_reasoning: true
      supports_vision: false
      input_cost_per_token: 0.0000014
      output_cost_per_token: 0.0000044
      cache_read_input_token_cost: 0.00000014