---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headroom
spec:
  chartRef:
    kind: OCIRepository
    name: headroom
  interval: 30m
  values:
    controllers:
      headroom:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/headroomlabs-ai/headroom
              tag: 0.40.0-code-nonroot@sha256:2cdf4fd37d415076e0c30eafeb21a50b04456e058caa84c1deb6bdccc6a2fe61
            env:
              HEADROOM_COMPRESS_ALLOW_REMOTE: 1
              HEADROOM_COMPRESS_USER_MESSAGES: 1
            envFrom:
              - secretRef:
                  name: headroom-secret
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 2Gi
    persistence:
      workspace:
        enabled: true
        type: persistentVolumeClaim
        size: 5Gi
        storageClass: miroir-no-replica
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /workspace
    route:
      app:
        hostnames:
          - headroom.mrtb.io
        parentRefs:
          - name: gateway-internal
            namespace: network
    service:
      app:
        ports:
          http:
            port: 8787
    defaultPodOptions:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist