apiVersion: kguardian.dev/v1alpha1
kind: SeccompProfile
metadata:
  name: deployment-gitea-act-runner
  namespace: actions
  annotations:
    kguardian.dev/capture-complete: "true"
    kguardian.dev/capture-level: full
spec:
  defaultAction: SCMP_ACT_LOG
  architectures:
    - SCMP_ARCH_X86_64
  syscalls:
    - names:
        - accept4
        - access
        - arch_prctl
        - bind
        - brk
        - capget
        - capset
        - chdir
        - chmod
        - clone
        - clone3
        - close
        - close_range
        - connect
        - dup2
        - dup3
        - epoll_create1
        - epoll_ctl
        - epoll_pwait
        - eventfd2
        - execve
        - exit_group
        - faccessat
        - faccessat2
        - fchdir
        - fchmodat
        - fchmodat2
        - fchownat
        - fcntl
        - fdatasync
        - flock
        - fork
        - fstat
        - fstatfs
        - fsync
        - ftruncate
        - futex
        - getcwd
        - getdents64
        - getegid
        - geteuid
        - getgid
        - getpeername
        - getpgid
        - getpgrp
        - getpid
        - getppid
        - getrandom
        - getresgid
        - getresuid
        - getrlimit
        - getsockname
        - getsockopt
        - gettid
        - getuid
        - inotify_add_watch
        - inotify_init1
        - ioctl
        - kill
        - listen
        - lseek
        - lstat
        - madvise
        - mkdir
        - mkdirat
        - mknodat
        - mmap
        - mount
        - mprotect
        - munmap
        - nanosleep
        - newfstatat
        - open
        - openat
        - openat2
        - pidfd_open
        - pidfd_send_signal
        - pipe
        - pipe2
        - prctl
        - pread64
        - prlimit64
        - pwrite64
        - quotactl
        - read
        - readlink
        - readlinkat
        - recvfrom
        - recvmsg
        - renameat
        - restart_syscall
        - rseq
        - rt_sigaction
        - rt_sigprocmask
        - rt_sigreturn
        - rt_sigtimedwait
        - sched_getaffinity
        - sched_yield
        - seccomp
        - select
        - sendfile
        - sendmsg
        - sendto
        - set_robust_list
        - set_tid_address
        - setgid
        - setgroups
        - setitimer
        - setpgid
        - setsid
        - setsockopt
        - setuid
        - sigaltstack
        - socket
        - socketpair
        - stat
        - statfs
        - statx
        - tgkill
        - tkill
        - umask
        - umount2
        - uname
        - unlinkat
        - vfork
        - wait4
        - waitid
        - write
        - writev
      action: SCMP_ACT_ALLOW
  workloadRef:
    kind: Deployment
    name: gitea-act-runner
