---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kguardian
spec:
  chartRef:
    kind: OCIRepository
    name: kguardian
  interval: 30m
  values:
    ai:
      enabled: true
      provider: openai
      baseUrl: http://litellm.ai.svc.cluster.local:4000/v1
      model: mistral/small-4
      mcp:
        enabled: true
        auth:
          allowUnauthenticated: true
      secret: kguardian-litellm
    broker:
      auth:
        enabled: true
        existingSecret: kguardian-secret
    llmBridge:
      replicaCount: 1
    telemetry:
      enabled: false
    supplychain:
      enabled: true
    controller:
      excludedNamespaces:
        - kguardian
    database:
      persistence:
        existingClaim: kguardian-db