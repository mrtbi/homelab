---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kguardian
spec:
  chartRef:
    kind: OCIRepository
    name: kguardian
  interval: 30m
  values:
    ai:
      mcp:
        enabled: true
        auth:
          allowUnauthenticated: true
    llmBridge:
      replicaCount: 1
    telemetry:
      enabled: false
    controller:
      excludedNamespaces:
        - kguardian
    database:
      persistence:
        existingClaim: kguardian-db