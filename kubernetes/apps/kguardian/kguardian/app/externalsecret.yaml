apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kguardian
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: kguardian-secret
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: LITELLM_MASTER_KEY
    - secretKey: token
      remoteRef:
        key: KGUARDIAN_TOKEN
    - secretKey: read
      remoteRef:
        key: KGUARDIAN_READ_TOKEN
    - secretKey: ingest
      remoteRef:
        key: KGUARDIAN_INGEST_TOKEN
    - secretKey: supplychain
      remoteRef:
        key: KGUARDIAN_SUPPLYCHAIN_TOKEN