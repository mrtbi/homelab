apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: signoz
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: signoz
      version: "0.147.0"
      sourceRef:
        kind: HelmRepository
        name: signoz
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  rollback:
    cleanupOnFail: true