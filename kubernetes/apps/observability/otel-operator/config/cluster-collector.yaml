apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-collector-cluster
  namespace: observability
spec:
  mode: deployment
  replicas: 0
  image: docker.io/otel/opentelemetry-collector-contrib:0.164.0
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  env:
    - name: PROMETHEUS_OTLP_ENDPOINT
      value: 'http://prometheus-operated.observability.svc.cluster.local:9090/api/v1/otlp/v1/metrics'
    - name: LOKI_OTLP_ENDPOINT
      value: 'http://loki-gateway.observability.svc.cluster.local/otlp/v1/logs'
    - name: K8S_CLUSTER_NAME
      value: 'main'
  config:
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      k8s_cluster:
        auth_type: serviceAccount
        collection_interval: 30s
        node_conditions_to_report:
          - Ready
          - MemoryPressure
          - DiskPressure
          - PIDPressure
          - NetworkUnavailable
        allocatable_types_to_report:
          - cpu
          - memory
          - ephemeral-storage
          - pods
      k8sobjects:
        auth_type: serviceAccount
        objects:
          - name: events
            mode: watch
            group: events.k8s.io
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      resource/cluster:
        attributes:
          - key: k8s.cluster.name
            value: ${env:K8S_CLUSTER_NAME}
            action: upsert
      resource/events:
        attributes:
          - key: service.name
            value: k8s-events
            action: insert
      batch:
        send_batch_size: 8192
        timeout: 5s
    exporters:
      otlphttp/prometheus:
        metrics_endpoint: ${env:PROMETHEUS_OTLP_ENDPOINT}
      otlphttp/loki:
        logs_endpoint: ${env:LOKI_OTLP_ENDPOINT}
    service:
      extensions: [health_check]
      telemetry:
        logs:
          encoding: json
      pipelines:
        metrics:
          receivers: [k8s_cluster]
          processors: [memory_limiter, resource/cluster, batch]
          exporters: [otlphttp/prometheus]
        logs:
          receivers: [k8sobjects]
          processors: [memory_limiter, resource/cluster, resource/events, batch]
          exporters: [otlphttp/loki]