apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: otel-operator
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: otel-operator-secret
    creationPolicy: Owner
  data:
    - secretKey: SIGNOZ_INGESTION_KEY
      remoteRef:
        key: SIGNOZ_INGESTION_KEY