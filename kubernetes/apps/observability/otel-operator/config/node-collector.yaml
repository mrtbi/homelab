apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-collector-daemonset
  namespace: observability
spec:
  mode: daemonset
  image: docker.io/otel/opentelemetry-collector-contrib:0.163.2
  # run on control-plane nodes too
  tolerations:
    - operator: Exists
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  env:
    # Prometheus 3.x native OTLP receiver (needs --web.enable-otlp-receiver)
    - name: PROMETHEUS_OTLP_ENDPOINT
      value: 'http://prometheus-operated.observability.svc.cluster.local:9090/api/v1/otlp/v1/metrics'
    # Loki 3.x native OTLP endpoint (via gateway)
    - name: LOKI_OTLP_ENDPOINT
      value: 'http://loki-gateway.observability.svc.cluster.local/otlp/v1/logs'
    - name: K8S_CLUSTER_NAME
      value: 'main'
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: K8S_HOST_IP
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP
    - name: K8S_POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: K8S_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: k8s.cluster.name=$(K8S_CLUSTER_NAME)
  volumes:
    - name: varlog
      hostPath:
        path: /var/log
    - name: hostfs
      hostPath:
        path: /
  volumeMounts:
    - name: varlog
      mountPath: /var/log
      readOnly: true
    - name: hostfs
      mountPath: /hostfs
      readOnly: true
      mountPropagation: HostToContainer
  config:
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      filelog/k8s:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          # don't ship the collectors' own logs (feedback loop)
          - /var/log/pods/observability_otel-collector-*/*/*.log
        include_file_name: false
        include_file_path: true
        start_at: end
        operators:
          # parses CRI format and sets k8s.namespace.name, k8s.pod.name,
          # k8s.pod.uid, k8s.container.name from the file path
          - id: container-parser
            type: container

      kubeletstats:
        auth_type: serviceAccount
        collection_interval: 30s
        endpoint: ${env:K8S_HOST_IP}:10250
        insecure_skip_verify: true
        node: ${env:K8S_NODE_NAME}
        k8s_api_config:
          auth_type: serviceAccount
        extra_metadata_labels:
          - container.id
          - k8s.volume.type
        metric_groups:
          - container
          - pod
          - node
          - volume
        metrics:
          container.cpu.usage:
            enabled: true
          container.uptime:
            enabled: true
          k8s.container.cpu_limit_utilization:
            enabled: true
          k8s.container.cpu_request_utilization:
            enabled: true
          k8s.container.memory_limit_utilization:
            enabled: true
          k8s.container.memory_request_utilization:
            enabled: true
          k8s.container.cpu.node.utilization:
            enabled: true
          k8s.container.memory.node.utilization:
            enabled: true
          k8s.node.cpu.usage:
            enabled: true
          k8s.node.uptime:
            enabled: true
          k8s.pod.cpu.usage:
            enabled: true
          k8s.pod.cpu_limit_utilization:
            enabled: true
          k8s.pod.cpu_request_utilization:
            enabled: true
          k8s.pod.memory_limit_utilization:
            enabled: true
          k8s.pod.memory_request_utilization:
            enabled: true
          k8s.pod.uptime:
            enabled: true

      hostmetrics:
        collection_interval: 30s
        root_path: /hostfs
        scrapers:
          cpu: {}
          load: {}
          memory: {}
          disk:
            exclude:
              devices:
                - ^ram\d+$
                - ^zram\d+$
                - ^loop\d+$
                - ^fd\d+$
                - ^sd[a-z]\d+$
                - ^vd[a-z]\d+$
                - ^nvme\d+n\d+p\d+$
              match_type: regexp
          filesystem:
            exclude_fs_types:
              fs_types:
                - autofs
                - binfmt_misc
                - bpf
                - cgroup2?
                - configfs
                - debugfs
                - devpts
                - devtmpfs
                - fusectl
                - hugetlbfs
                - iso9660
                - mqueue
                - nsfs
                - overlay
                - proc
                - procfs
                - pstore
                - securityfs
                - selinuxfs
                - squashfs
                - sysfs
                - tracefs
              match_type: strict
            exclude_mount_points:
              match_type: regexp
              mount_points:
                - /dev/*
                - /proc/*
                - /sys/*
                - /run/*
                - /var/lib/kubelet/*
          network:
            exclude:
              interfaces:
                - ^lxc.*$       # Cilium pod veths
                - ^cilium_.*$   # Cilium host/net/vxlan
                - ^veth.*$
                - ^dummy.*$
                - ^lo$
              match_type: regexp

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25

      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.cronjob.name
            - k8s.job.name
            - k8s.node.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.pod.start_time
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection

      resourcedetection:
        detectors: [env, k8snode, system]
        override: false
        timeout: 2s
        k8snode:
          auth_type: serviceAccount
          node_from_env_var: K8S_NODE_NAME
        system:
          resource_attributes:
            host.id:
              enabled: false
            host.name:
              enabled: false
            os.type:
              enabled: true

      # Give pod logs a sensible service.name (Loki's service_name label)
      # when the app didn't set one itself.
      transform/service-name:
        error_mode: ignore
        log_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["k8s.deployment.name"]) where attributes["service.name"] == nil
              - set(attributes["service.name"], attributes["k8s.statefulset.name"]) where attributes["service.name"] == nil
              - set(attributes["service.name"], attributes["k8s.daemonset.name"]) where attributes["service.name"] == nil
              - set(attributes["service.name"], attributes["k8s.cronjob.name"]) where attributes["service.name"] == nil
              - set(attributes["service.name"], attributes["k8s.container.name"]) where attributes["service.name"] == nil

      batch:
        send_batch_size: 8192
        timeout: 5s

    exporters:
      otlphttp/prometheus:
        metrics_endpoint: ${env:PROMETHEUS_OTLP_ENDPOINT}
      otlphttp/loki:
        logs_endpoint: ${env:LOKI_OTLP_ENDPOINT}
        # only needed if Loki runs with auth_enabled: true
        # headers:
        #   X-Scope-OrgID: main

    service:
      extensions: [health_check]
      telemetry:
        logs:
          encoding: json
      pipelines:
        metrics:
          receivers: [otlp, kubeletstats, hostmetrics]
          processors: [memory_limiter, k8sattributes, resourcedetection, batch]
          exporters: [otlphttp/prometheus]
        logs:
          receivers: [otlp, filelog/k8s]
          processors: [memory_limiter, k8sattributes, resourcedetection, transform/service-name, batch]
          exporters: [otlphttp/loki]