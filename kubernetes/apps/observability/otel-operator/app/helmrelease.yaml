apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-operator
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: opentelemetry-operator
      version: 0.126.2
      sourceRef:
        kind: HelmRepository
        name: otel-operator
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  rollback:
    cleanupOnFail: true